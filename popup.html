<!DOCTYPE html>

<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Netflix Subtitles Translator</title>
<style>
html, body { margin: 0; padding: 0; font-family: sans-serif; font-size: 13px; }
body { width: 260px; background: #fff; color: #222; }
header {
	background: linear-gradient(to bottom, #3091d3, #277fc0);
	color: #fff;
	padding: 10px 12px;
	font-size: 14px;
	font-weight: bold;
}
main { padding: 12px; }
.row { margin-bottom: 10px; }
.row label { display: block; margin-bottom: 4px; color: #444; font-size: 12px; }
.row select, .row button {
	width: 100%;
	box-sizing: border-box;
	padding: 6px 8px;
	font-size: 13px;
}
.row button {
	background: #3091d3;
	color: #fff;
	border: 0;
	border-radius: 3px;
	cursor: pointer;
}
.row button:hover { background: #277fc0; }
.hint { font-size: 11px; color: #888; margin-top: 4px; }
.link { display: block; text-align: center; margin-top: 10px; color: #3091d3; cursor: pointer; text-decoration: none; font-size: 12px; }
.link:hover { text-decoration: underline; }
.status { font-size: 11px; color: #2a8a2a; height: 12px; margin-top: 4px; }
</style>
</head>
